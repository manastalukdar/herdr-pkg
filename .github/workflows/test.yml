name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # `python`, not `python3`: setup-python's Windows install has no python3
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/install.py mods/pkg/pkg.py
